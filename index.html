<title>Dziennik Gladiatora</title>


<link rel="preload" href="fonts/manrope-latin-cf48e3.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/manrope-latin-ext-b4290e.woff2" as="font" type="font/woff2" crossorigin>

<style>
  :root { --bg:#F2F3F5; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#F2F3F5; }
  }

<div id="root"><div style="display:flex;justify-content:center;min-height:100vh;background:#F2F3F5"><div style="width:100%;max-width:430px;padding:12px 12px 0"><div style="background:linear-gradient(160deg,#1C1F26 0%,#15171C 60%,#121418 100%);border:1px solid #23262D;border-radius:24px;padding:22px 20px 19px;color:#F3F4F6"><div style="font-family:Cinzel,Georgia,serif;font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;line-height:1.2">Dziennik Gladiatora</div><div style="width:38px;height:3px;border-radius:3px;background:#E0392E;margin-top:11px"></div><div style="margin-top:14px;height:22px"></div></div><div style="padding:46px 32px;text-align:center;color:#8A909A;font:500 14px Manrope,-apple-system,sans-serif">Wczytuję…</div></div></div></div>
<script>
/* Wersja na telefon (GitHub Pages): dane zapisują się w pamięci tej aplikacji na telefonie.
   Zabezpieczenia danych:
   1) każdy zapis jest dublowany w drugiej pamięci (IndexedDB) + dzienne kopie z 14 dni;
      jeśli główna pamięć jest pusta lub uszkodzona, dane są odtwarzane przed startem aplikacji,
   2) przypomnienie o kopii do pliku, gdy ostatnia była ponad 7 dni temu,
   3) prośba do przeglądarki o trwałe przechowywanie danych.
   Kod aplikacji jest identyczny z wersją na claude.ai. */
(function () {
  var KLUCZ = "trening:v4", OSTATNIA = "gb:ostatniaKopiaPliku", DNI_KOPII = 14;

  // --- druga pamięć (IndexedDB) ---
  function baza() {
    return new Promise(function (ok, bl) {
      var r = indexedDB.open("dziennik-kopie", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("kopie"); };
      r.onsuccess = function () { ok(r.result); };
      r.onerror = function () { bl(r.error); };
    });
  }
  function idb(tryb, fn) {
    return baza().then(function (db) {
      return new Promise(function (ok, bl) {
        var t = db.transaction("kopie", tryb), s = t.objectStore("kopie"), wynik;
        fn(s, function (w) { wynik = w; });
        t.oncomplete = function () { ok(wynik); };
        t.onerror = function () { bl(t.error); };
      });
    });
  }
  function dzis() {
    var d = new Date(), z = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
  }
  function poprawne(tekst) {
    try { var j = JSON.parse(tekst); return j && Array.isArray(j.workouts); } catch (e) { return false; }
  }
  function dubluj(tekst) {
    if (!poprawne(tekst)) return;
    idb("readwrite", function (s) {
      s.put(tekst, "ostatnia");
      s.put(tekst, "dzien-" + dzis());
      var r = s.getAllKeys();
      r.onsuccess = function () {
        var dni = r.result.filter(function (k) { return String(k).indexOf("dzien-") === 0; }).sort();
        dni.slice(0, Math.max(0, dni.length - DNI_KOPII)).forEach(function (k) { s.delete(k); });
      };
    }).catch(function () {});
  }
  // Każdy zapis aplikacji do pamięci głównej trafia też do drugiej pamięci —
  // 2 s po ostatniej zmianie (żeby nie spowalniać wpisywania), a przy wyjściu z aplikacji od razu.
  var zapisOryg = Storage.prototype.setItem, lustroTekst = null, lustroTimer = null;
  function lustroTeraz() {
    clearTimeout(lustroTimer);
    if (lustroTekst == null) return;
    var t = lustroTekst; lustroTekst = null; dubluj(t);
  }
  Storage.prototype.setItem = function (k, v) {
    zapisOryg.apply(this, arguments);
    if (this === window.localStorage && k === KLUCZ) {
      lustroTekst = String(v); clearTimeout(lustroTimer); lustroTimer = setTimeout(lustroTeraz, 2000);
    }
  };
  function przyWyjsciu() {
    try { window.__gbZapiszTeraz && window.__gbZapiszTeraz(); } catch (e) {} // najpierw zapis główny
    lustroTeraz();
  }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") przyWyjsciu(); });
  window.addEventListener("pagehide", przyWyjsciu);
  // Przed startem aplikacji: odtworzenie danych, jeśli pamięć główna jest pusta/uszkodzona.
  var gotowe = (function () {
    var glowna = null;
    try { glowna = localStorage.getItem(KLUCZ); } catch (e) {}
    if (glowna && poprawne(glowna)) { dubluj(glowna); return Promise.resolve(); }
    return idb("readonly", function (s, wynik) {
      var r = s.get("ostatnia"); r.onsuccess = function () { wynik(r.result); };
    }).then(function (kopia) {
      if (kopia && poprawne(kopia)) {
        zapisOryg.call(localStorage, KLUCZ, kopia);
        zapisOryg.call(localStorage, KLUCZ + ":at", String(Date.now()));
      }
    }).catch(function () {});
  })();

  // --- zapis kopii do pliku ---
  function zapiszPlik(o) {
    var plik = new File([o.data], o.filename, { type: "application/json" });
    var p;
    if (navigator.canShare && navigator.canShare({ files: [plik] }))
      p = navigator.share({ files: [plik], title: o.filename });
    else {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(plik);
      a.download = o.filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      p = Promise.resolve();
    }
    return p.then(function () {
      try { zapisOryg.call(localStorage, OSTATNIA, String(Date.now())); } catch (e) {}
      var pasek = document.getElementById("gb-przypomnienie");
      if (pasek) pasek.remove();
    });
  }
  window.claude = {
    use: function (n) {
      if (n === "db") return gotowe.then(function () { return null; }); // dane lokalne, po odtworzeniu
      return Promise.resolve(n === "downloads" ? { save: zapiszPlik } : null);
    },
  };

  // --- przypomnienie o kopii do pliku (co 7 dni) ---
  function przypomnij() {
    var dane = null, ost = 0;
    try { dane = JSON.parse(localStorage.getItem(KLUCZ) || "null"); ost = Number(localStorage.getItem(OSTATNIA)) || 0; } catch (e) {}
    if (!dane || !dane.workouts || !dane.workouts.length) return;
    if (Date.now() - ost < 7 * 864e5) return;
    var dni = ost ? Math.floor((Date.now() - ost) / 864e5) : null;
    var pasek = document.createElement("div");
    pasek.id = "gb-przypomnienie";
    pasek.setAttribute("style", "position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 8px);z-index:70;width:calc(100% - 24px);max-width:406px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#F6EAE9;border:1px solid rgba(199,54,44,.3);box-shadow:0 12px 28px -14px rgba(21,23,28,.5);font:600 12.5px Manrope,-apple-system,sans-serif;color:#4D525C");
    var t = document.createElement("span");
    t.style.flex = "1";
    t.textContent = dni == null ? "Zrób kopię zapasową danych do pliku — dane są tylko w tym telefonie." : "Ostatnia kopia do pliku: " + dni + " dni temu. Zrób nową.";
    var b = document.createElement("button");
    b.textContent = "Zapisz kopię";
    b.setAttribute("style", "border:none;border-radius:9px;padding:8px 11px;background:#C7362C;color:#fff;font:700 12.5px Manrope,-apple-system,sans-serif;cursor:pointer;white-space:nowrap");
    b.onclick = function () {
      try { window.__gbZapiszTeraz && window.__gbZapiszTeraz(); } catch (e) {}
      var d = JSON.parse(localStorage.getItem(KLUCZ));
      var tekst = JSON.stringify({ aplikacja: "Dziennik Gladiatora", wersja: 1, zapisano: new Date().toISOString(),
        dane: { workouts: d.workouts || [], custom: d.custom || [], templates: d.templates || [], weights: d.weights || {},
          measures: d.measures || {}, ustawienia: d.ustawienia || {}, kalkulator: d.kalkulator || null } }, null, 2);
      zapiszPlik({ filename: "dziennik-gladiatora-" + dzis() + ".json", data: tekst }).catch(function () {});
    };
    var x = document.createElement("button");
    x.textContent = "×"; x.setAttribute("aria-label", "Później");
    x.setAttribute("style", "border:none;background:none;font-size:18px;color:#868C96;cursor:pointer;padding:0 2px");
    x.onclick = function () { pasek.remove(); };
    pasek.appendChild(t); pasek.appendChild(b); pasek.appendChild(x);
    document.body.appendChild(pasek);
  }

  // --- przeniesienie danych z wersji na claude.ai (zaszyfrowane w pliku dane.enc.json) ---
  function b64(t) { return Uint8Array.from(atob(t), function (c) { return c.charCodeAt(0); }); }
  function odszyfruj(p, kod) {
    var n = String(kod).toLowerCase().replace(/[^a-z0-9]/g, "");
    return crypto.subtle.importKey("raw", new TextEncoder().encode(n), "PBKDF2", false, ["deriveKey"])
      .then(function (k) {
        return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(p.sol), iterations: p.iter, hash: "SHA-256" },
          k, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      })
      .then(function (k) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(p.iv) }, k, b64(p.szyfr)); })
      .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function przeniesienie() {
    var jest = null;
    try { jest = localStorage.getItem(KLUCZ); if (sessionStorage.getItem("gb:pominieto")) return; } catch (e) {}
    if (jest && poprawne(jest)) return;
    fetch("dane.enc.json").then(function (r) { return r.ok ? r.json() : null; }).then(function (p) {
      if (!p || !p.szyfr) return;
      var tlo = document.createElement("div");
      tlo.id = "gb-przeniesienie";
      tlo.setAttribute("style", "position:fixed;inset:0;z-index:80;background:rgba(21,23,28,.55);display:flex;align-items:center;justify-content:center;padding:20px;font-family:Manrope,-apple-system,sans-serif");
      tlo.innerHTML =
        '<div style="width:100%;max-width:360px;background:#F7F8F9;border:1px solid #D8DAE0;border-radius:20px;padding:22px 18px;box-shadow:0 24px 60px -20px rgba(21,23,28,.6)">' +
        '<div style="font-size:20px;font-weight:800;letter-spacing:-.03em;color:#15171C">Przenieś swoje dane</div>' +
        '<p style="font-size:13.5px;color:#4D525C;line-height:1.5;margin:8px 0 14px">Wpisz kod, który dostałeś od Claude. Wczytam Twoje treningi, bloki, wagę i ustawienia z poprzedniej wersji aplikacji.</p>' +
        '<input id="gb-kod" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="xxxx-xxxx-xxxx" style="width:100%;box-sizing:border-box;padding:12px 13px;font:600 17px Manrope,-apple-system,sans-serif;letter-spacing:.06em;border:1px solid #D8DAE0;border-radius:11px;background:#fff;color:#15171C">' +
        '<div id="gb-kod-blad" style="display:none;margin-top:8px;font-size:12.5px;color:#C7362C;font-weight:600"></div>' +
        '<button id="gb-kod-ok" style="display:block;width:100%;margin-top:14px;padding:12px;border:none;border-radius:13px;background:linear-gradient(180deg,#D0392E,#A72C23);color:#fff;font:600 14px Manrope,-apple-system,sans-serif;cursor:pointer">Wczytaj moje dane</button>' +
        '<button id="gb-kod-pomin" style="display:block;width:100%;margin-top:9px;padding:12px;border:1px solid #D8DAE0;border-radius:13px;background:#F7F8F9;color:#15171C;font:600 14px Manrope,-apple-system,sans-serif;cursor:pointer">Nie teraz</button>' +
        "</div>";
      document.body.appendChild(tlo);
      var pole = document.getElementById("gb-kod"), blad = document.getElementById("gb-kod-blad"), ok = document.getElementById("gb-kod-ok");
      function wczytaj() {
        blad.style.display = "none"; ok.disabled = true; ok.textContent = "Wczytuję…";
        odszyfruj(p, pole.value).then(function (d) {
          if (!d || typeof d.value !== "string" || !poprawne(d.value)) throw new Error("dane");
          zapisOryg.call(localStorage, KLUCZ, d.value);
          zapisOryg.call(localStorage, KLUCZ + ":at", String(Date.now()));
          dubluj(d.value);
          setTimeout(function () { location.reload(); }, 300);
        }).catch(function () {
          ok.disabled = false; ok.textContent = "Wczytaj moje dane";
          blad.textContent = "Nieprawidłowy kod — sprawdź i spróbuj jeszcze raz."; blad.style.display = "block";
        });
      }
      ok.onclick = wczytaj;
      pole.onkeydown = function (e) { if (e.key === "Enter") wczytaj(); };
      document.getElementById("gb-kod-pomin").onclick = function () {
        try { sessionStorage.setItem("gb:pominieto", "1"); } catch (e) {}
        tlo.remove();
      };
    }).catch(function () {});
  }

  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  window.addEventListener("load", function () {
    setTimeout(przypomnij, 1500);
    gotowe.then(przeniesienie);
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  });
})();
</script>
