/* Wersja na telefon (GitHub Pages): dane zapisują się w pamięci tej aplikacji na telefonie.
   Kopia zapasowa zapisuje się jako plik (udostępnij / pobierz), a aplikacja działa bez internetu. */
(function () {
  function zapiszPlik(o) {
    var plik = new File([o.data], o.filename, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [plik] }))
      return navigator.share({ files: [plik], title: o.filename });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(plik);
    a.download = o.filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return Promise.resolve();
  }
  window.claude = {
    use: function (n) { return Promise.resolve(n === "downloads" ? { save: zapiszPlik } : null); },
  };
  // Prośba do przeglądarki, żeby nie czyściła danych aplikacji.
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if ("serviceWorker" in navigator)
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
})();
